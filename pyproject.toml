[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fsci"
version = "0.1.0"
description = "Flux-Surface Constrained Inversion pipeline for TCABR plasma emissivity reconstruction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Douglas Novaes", email = "dougnovaes@alumni.usp.br" },
]
keywords = ["tokamak", "plasma-physics", "fusion", "tomography", "inverse-problems", "TCABR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "freeqdsk",
]

[project.optional-dependencies]
interactive = ["ipywidgets"]
dev = ["pytest", "pytest-cov"]

[project.urls]
Repository = "https://github.com/dougnovaes/tcabr-fsci"

[tool.setuptools.packages.find]
where = ["src"]
